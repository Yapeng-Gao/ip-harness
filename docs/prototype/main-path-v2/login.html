<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>登录 · 虚拟知产公司</title>
<link rel="stylesheet" href="shell.css">
</head>
<body class="marketing-site">
  <div class="login-card">
    <a class="brand" href="welcome.html" style="border:0;width:auto;padding:0;height:auto">
      <span class="brand-mark">虚</span>
      <span class="brand-copy"><strong>虚拟知产公司</strong><small>SIGN IN</small></span>
    </a>
    <h1>选择身份</h1>
    <p>登录后先到工作首页（助手）。点「项目」再进公司 / 案盘 / 开案子。</p>
    <div class="role-pick" id="role-pick">
      <button type="button" data-role="enterprise" class="active"><strong>企业研发</strong><small>澄明科技 · 陈宇</small></button>
      <button type="button" data-role="agency"><strong>代理所</strong><small>衡知专利 · 林岚</small></button>
    </div>
    <button class="btn btn-ink" type="button" id="go" style="width:100%">进入工作入口 →</button>
    <p style="margin-top:14px;font-size:12px"><a class="weak-link" href="welcome.html">← 返回宣传站</a></p>
  </div>
  <script src="app.js"></script>
  <script>
  let r = 'enterprise';
  document.querySelectorAll('#role-pick button').forEach(b => b.addEventListener('click', () => {
    r = b.dataset.role;
    document.querySelectorAll('#role-pick button').forEach(x => x.classList.toggle('active', x === b));
  }));
  document.getElementById('go').addEventListener('click', () => {
    localStorage.setItem('mpv2-role', r);
    localStorage.setItem('mpv2-mode', 'assistant');
    let dest = 'home.html?role=' + r;
    try {
      const d = JSON.parse(sessionStorage.getItem('mpv2-delegation') || 'null');
      if (d && d.goal) {
        dest = 'delegate.html?step=plan&role=' + r;
      }
    } catch (e) {}
    const params = new URLSearchParams(location.search);
    if (params.get('afterGoal') === '1') {
      dest = 'delegate.html?step=plan&role=' + r;
    }
    location.href = dest;
  });
  </script>
</body></html>
