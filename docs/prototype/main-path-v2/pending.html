<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>转工作台拍板 · 虚拟知产公司</title>
<link rel="stylesheet" href="shell.css">
<script>
(function () {
  var q = new URLSearchParams(location.search);
  var dept = q.get('dept') || (localStorage.getItem('mpv2-role') === 'agency' ? 'oa' : 'disclosure');
  var role = q.get('role') || localStorage.getItem('mpv2-role') || 'enterprise';
  var target = 'dept.html?dept=' + encodeURIComponent(dept) + '&gate=1&role=' + encodeURIComponent(role);
  location.replace(target);
})();
</script>
</head>
<body data-page="pending">
<div class="app-shell" style="padding:48px 24px;text-align:center">
  <p class="kicker">主路径已废独立确认页</p>
  <h1 class="page-title" style="font-size:20px">正在打开工作台右栏闸…</h1>
  <p class="page-sub">拍板在工作台同屏进行。若未自动跳转，请点下方链接。</p>
  <p style="margin-top:18px"><a class="btn btn-ink" id="pending-fallback" href="dept.html?gate=1">打开工作台拍板 →</a></p>
</div>
<script src="app.js"></script>
<script>
(function () {
  var q = new URLSearchParams(location.search);
  var dept = q.get('dept') || 'disclosure';
  var a = document.getElementById('pending-fallback');
  if (a && window.MPV2) a.href = MPV2.withRole('dept.html?dept=' + dept + '&gate=1');
  else if (a) a.href = 'dept.html?dept=' + dept + '&gate=1';
})();
</script>
</body></html>
