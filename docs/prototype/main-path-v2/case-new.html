<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>开案子 · 虚拟知产公司</title>
<link rel="stylesheet" href="shell.css">
</head>
<body data-page="case-new">
<div class="app-shell">
<header class="topbar">
  <a class="brand" href="home.html" data-keep-role>
    <span class="brand-mark">虚</span>
    <span class="brand-copy"><strong>虚拟知产公司</strong><small>VIRTUAL IP COMPANY</small></span>
  </a>
  <div class="topbar-context topbar-context-cross" data-shell="cross" aria-hidden="true"></div>
  <div class="topbar-actions">
    <a class="icon-btn notice-button" href="dept.html?dept=disclosure&gate=1" data-keep-role aria-label="待确认">🔔<span></span></a>
    <div class="mode-switch mode-switch-quiet" aria-label="助手、项目与专业">
      <button type="button" data-mode="assistant" aria-pressed="false">助手</button>
      <button type="button" data-mode="project" class="active" aria-pressed="true">项目</button>
      <button type="button" data-mode="studio" aria-pressed="false">专业</button>
    </div>
    <details class="avatar-menu">
      <summary class="avatar-menu-sum" aria-label="账户与角色">
        <img class="avatar avatar-photo" src="assets/portraits/chen.png" alt="" width="30" height="30">
      </summary>
      <div class="avatar-menu-panel" role="menu">
        <div class="avatar-menu-label">角色</div>
        <div class="role-switch" aria-label="切换角色">
          <button type="button" data-role="enterprise" class="active" aria-pressed="true">企业研发</button>
          <button type="button" data-role="agency" aria-pressed="false">代理所</button>
        </div>
        <div class="avatar-menu-label">设置与后勤</div>
        <a class="avatar-menu-link" href="docket.html" data-keep-role>期限</a>
        <a class="avatar-menu-link" href="billing.html" data-keep-role>账单</a>
        <a class="avatar-menu-link" href="members.html" data-keep-role>成员</a>
        <a class="avatar-menu-link" href="confirm-log.html" data-keep-role>确认记录</a>
        <a class="avatar-menu-link" href="welcome.html">官网</a>
      </div>
    </details>
  </div>
</header>
<div class="app-main">
<aside class="sidebar sidebar-slim" aria-label="本案辅助">
  <div class="workspace-label" data-show-role="enterprise">澄明科技有限公司<span>研发负责人工作区</span></div>
  <div class="workspace-label hidden" data-show-role="agency">衡知专利代理事务所<span>代理师工作区</span></div>
  <div class="sidebar-bottom">
    <div class="human-guard"><span>⛨</span><span><strong>关键节点，人来决策</strong><small>专家出建议稿 · 你来拍板</small></span></div>
  </div>
</aside>
<main class="content">

  <p class="kicker">开案子</p>
  <h1 class="page-title">开新案子</h1>
  <p class="page-sub">填短一点就能开。创建后进<strong>本案</strong>公司页（看卡点/下一步），再「去当前部门」。目标可选。</p>
  <form class="form-stack" id="new-case" onsubmit="return false;" autocomplete="off">
    <label>案名<input id="case-name" name="case-name" required autocomplete="off" placeholder="例如：磁驱泵智能控制系统…"></label>
    <label>本单位 / 客户<input id="case-org" name="org" autocomplete="organization" placeholder="例如：澄明科技有限公司…" value="澄明科技有限公司"></label>
    <label>一句话目标（可选）
      <textarea id="case-goal" name="case-goal" rows="2" autocomplete="off" placeholder="例如：整理一项研发成果，评估如何保护…"></textarea>
    </label>
    <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center">
      <button class="btn btn-ink" type="submit" id="create-only">创建并进本案 →</button>
      <button class="btn btn-secondary" type="button" id="create-delegate">创建并开始持续委托 →</button>
      <a class="weak-link" href="home.html" data-keep-role>取消</a>
    </div>
    <p class="primary-cta-note" style="margin-top:10px">主按钮进本案公司页（进度壳）；次级也先落公司，再从公司弱入口进委托（委托不是登录后第一跳）。</p>
  </form>
  <script>
  document.addEventListener('DOMContentLoaded', () => {
    const nameEl = document.getElementById('case-name');
    const orgEl = document.getElementById('case-org');
    function requireCaseName() {
      const name = (nameEl.value || '').trim();
      if (!name) {
        nameEl.setAttribute('aria-invalid', 'true');
        MPV2.toast('请填写案名');
        nameEl.focus();
        return '';
      }
      nameEl.removeAttribute('aria-invalid');
      return name;
    }
    function readOrg() {
      return (orgEl && orgEl.value || '').trim();
    }
    document.getElementById('new-case').addEventListener('submit', (e) => {
      e.preventDefault();
      const name = requireCaseName();
      if (!name) return;
      // 演示诚实：开案 stub 新 id（勿永远复用 mp）；本单位写入 stub
      MPV2.createCaseStub(name, { client: readOrg() });
      localStorage.setItem('mpv2-mode', 'project');
      location.href = MPV2.withRole('company.html');
    });
    document.getElementById('create-delegate').addEventListener('click', () => {
      const name = requireCaseName();
      if (!name) return;
      const goal = document.getElementById('case-goal').value.trim() || name;
      const plan = MPV2.planFromGoal(goal);
      MPV2.setDelegation({ goal: plan.goal, step: 'plan', dept: plan.deptId });
      MPV2.createCaseStub(name, { client: readOrg() });
      localStorage.setItem('mpv2-mode', 'project');
      // 硬闸：交办后仍先进公司认知，再从公司弱入口进委托
      location.href = MPV2.withRole('company.html?delegate=1');
    });
  });
  </script>
</main></div></div><script src="app.js"></script></body></html>
