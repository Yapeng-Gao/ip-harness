<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>开案子 · 外挂知识产权部</title>
<link rel="stylesheet" href="shell.css">
</head>
<body data-page="case-new">
<div class="app-shell">
<header class="topbar">
  <a class="brand" href="home.html" data-keep-role>
    <span class="brand-mark">外</span>
    <span class="brand-copy"><strong>外挂知识产权部</strong><small>IP COMPANY</small></span>
  </a>
  <div class="topbar-context">
    <span class="context-label">当前项目</span>
    <button class="context-button" type="button">磁驱泵智能控制系统 ▾</button>
  </div>
  <div class="topbar-actions">
    <a class="weak-link" href="welcome.html">官网</a>
    <a class="icon-btn notice-button" href="pending.html?dept=disclosure" data-keep-role>🔔<span></span></a>
    <div class="mode-switch">
      <button type="button" data-mode="assistant">助手</button>
      <button type="button" data-mode="project" class="active">项目</button>
      <button type="button" data-mode="studio">专业</button>
    </div>
    <div class="role-switch">
      <button type="button" data-role="enterprise" class="active">企业研发</button>
      <button type="button" data-role="agency">代理所</button>
    </div>
    <span class="avatar avatar-human">陈</span>
  </div>
</header>
<div class="app-main">
<aside class="sidebar">
  <div class="workspace-label" data-show-role="enterprise">澄明科技有限公司<span>研发负责人工作区</span></div>
  <div class="workspace-label hidden" data-show-role="agency">衡知专利代理事务所<span>代理师工作区</span></div>
  <nav class="main-nav" data-show-role="enterprise">
    <a class="" href="home.html" data-keep-role>工作首页</a>
    <a class="" href="company.html" data-keep-role>本公司</a>
    <a class="active" href="cases.html" data-keep-role>项目与对象</a>
    <a class="" href="pending.html?dept=disclosure" data-keep-role>待你确认</a>
  </nav>
  <nav class="main-nav hidden" data-show-role="agency">
    <a class="" href="home.html" data-keep-role>工作首页</a>
    <a class="active" href="cases.html" data-keep-role>客户与案件</a>
    <a class="" href="company.html" data-keep-role>本案公司</a>
    <a class="" href="pending.html?dept=oa" data-keep-role>客户确认</a>
  </nav>
  <div class="sidebar-section">
    <div class="sidebar-heading"><span>进行中</span><a href="case-new.html" data-keep-role>＋</a></div>
    <a class="side-project active" href="dept.html?dept=disclosure" data-keep-role><span class="project-glyph">MP</span><span><strong>磁驱泵智能控制</strong><small>交底书完善中</small></span></a>
  </div>
  <div class="sidebar-bottom"><div class="human-guard"><span>⛨</span><span><strong>关键节点，人来决策</strong><small>专家出建议稿 · 你来拍板</small></span></div></div>
</aside>
<main class="content">

  <p class="kicker">开案子</p>
  <h1 class="page-title">立一条业务线</h1>
  <p class="page-sub">创建后进公司首页再「去当前部门」。可顺手发起持续委托（须可点通）。</p>
  <form class="form-stack" id="new-case" onsubmit="return false;">
    <label>案名 / 技术主题<input id="case-name" required placeholder="例如：磁驱泵智能控制系统"></label>
    <label>客户 / 本单位<input placeholder="澄明科技有限公司" value="澄明科技有限公司"></label>
    <label>可选 · 交办业务目标（持续委托）
      <textarea id="case-goal" rows="3" placeholder="例如：整理一项研发成果，评估如何保护"></textarea>
    </label>
    <div style="display:flex;gap:10px;flex-wrap:wrap">
      <button class="btn btn-ink" type="submit" id="create-only">创建并进公司 →</button>
      <button class="btn btn-primary" type="button" id="create-delegate">创建并开始持续委托 →</button>
      <a class="btn btn-ghost" href="home.html" data-keep-role>取消</a>
    </div>
  </form>
  <script>
  document.addEventListener('DOMContentLoaded', () => {
    document.getElementById('new-case').addEventListener('submit', (e) => {
      e.preventDefault();
      if (!document.getElementById('case-name').value.trim()) return;
      location.href = MPV2.withRole('company.html');
    });
    document.getElementById('create-delegate').addEventListener('click', () => {
      const name = document.getElementById('case-name').value.trim();
      const goal = document.getElementById('case-goal').value.trim() || name;
      if (!name) { MPV2.toast('请填写案名'); return; }
      MPV2.setDelegation({ goal, step: 'plan', dept: 'disclosure' });
      location.href = MPV2.withRole('delegate.html?step=plan');
    });
  });
  </script>
</main></div></div><script src="app.js"></script></body></html>
