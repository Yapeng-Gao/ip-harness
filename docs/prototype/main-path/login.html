<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>登录 · 外挂知识产权部</title>
<link rel="stylesheet" href="proto.css" />
<style>
  .wrap {
    min-height: calc(100vh - 41px);
    display: flex; align-items: center; justify-content: center;
    padding: 40px 20px;
    background: linear-gradient(180deg, var(--slate-50) 0%, var(--paper) 40%);
  }
  .panel {
    width: 100%; max-width: 400px;
    background: var(--paper); border: 1px solid var(--slate-200);
    border-radius: var(--radius-lg); box-shadow: var(--shadow-rest);
    padding: 32px 28px;
  }
  .panel h1 { font-size: 22px; font-weight: 700; letter-spacing: -0.01em; }
  .panel .tagline { margin-top: 8px; font-size: 14px; color: var(--slate-500); line-height: 1.5; }
  .roles { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 24px 0 18px; }
  .role {
    border: 1px solid var(--slate-200); border-radius: var(--radius-md);
    padding: 14px 12px; cursor: pointer; background: var(--slate-50);
    text-align: left; font-family: inherit;
  }
  .role.on { border-color: var(--slate-900); background: var(--paper); box-shadow: var(--shadow-rest); }
  .role .n { font-size: 14px; font-weight: 650; }
  .role .d { margin-top: 4px; font-size: 12px; color: var(--slate-500); line-height: 1.4; }
  label { display: block; font-size: 12px; font-weight: 600; color: var(--slate-600); margin-bottom: 6px; }
  input {
    width: 100%; height: 40px; padding: 0 12px; margin-bottom: 14px;
    border: 1px solid var(--slate-200); border-radius: var(--radius-md);
    font-size: 14px; font-family: inherit; background: var(--paper);
  }
  input:focus { outline: none; box-shadow: var(--focus); border-color: var(--slate-400); }
  .note { margin-top: 14px; font-size: 12px; color: var(--slate-400); text-align: center; line-height: 1.45; }
  .back { display: block; text-align: center; margin-top: 16px; font-size: 13px; color: var(--slate-500); }
  .back:hover { color: var(--slate-900); }
</style>
</head>
<body>
<nav class="proto-nav" aria-label="原型导航">
  <span class="brand">主路径原型</span>
  <a href="welcome.html">宣传站</a>
  <a href="login.html" class="on">登录</a>
  <a href="thin-home.html">薄入口</a>
  <a href="cases.html">案盘</a>
  <a href="company-home.html">公司首页</a>
  <a href="dept-workbench.html">部门台</a>
  <a href="pending-confirm.html">确认页</a>
  <span class="hint">样机本地会话 · 非真鉴权</span>
</nav>

<div class="wrap">
  <form class="panel" id="login" action="thin-home.html" method="get">
    <h1>登录</h1>
    <p class="tagline">外挂知识产权部 · 选好角色再进薄入口</p>
    <div class="roles" role="radiogroup" aria-label="角色">
      <button type="button" class="role on" data-role="enterprise" id="role-e">
        <div class="n">企业</div>
        <div class="d">薄入口 → 公司 / 开案子</div>
      </button>
      <button type="button" class="role" data-role="agency" id="role-a">
        <div class="n">代理</div>
        <div class="d">薄入口 → 案盘</div>
      </button>
    </div>
    <input type="hidden" name="role" id="role" value="enterprise" />
    <label for="email">邮箱（演示）</label>
    <input id="email" name="email" type="email" value="leslie@example.com" autocomplete="username" />
    <label for="pw">密码（演示）</label>
    <input id="pw" name="pw" type="password" value="demo" autocomplete="current-password" />
    <button class="btn btn-primary btn-block" type="submit">进入</button>
    <p class="note">样机可本地会话，非真登录。无货架、无七部地图。</p>
    <a class="back" href="welcome.html">← 回宣传站</a>
  </form>
</div>
<script>
document.querySelectorAll('.role').forEach(b => {
  b.addEventListener('click', () => {
    document.querySelectorAll('.role').forEach(x => x.classList.remove('on'));
    b.classList.add('on');
    document.getElementById('role').value = b.dataset.role;
  });
});
document.getElementById('login').addEventListener('submit', (e) => {
  e.preventDefault();
  const role = document.getElementById('role').value || 'enterprise';
  location.href = 'thin-home.html?role=' + encodeURIComponent(role);
});
</script>
</body>
</html>
