<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>开案子</title>
<link rel="stylesheet" href="proto.css" />
<style>
  .wrap { max-width: 480px; margin: 0 auto; padding: 40px 24px 80px; }
  .pos { font-size: 13px; color: var(--slate-500); }
  h1 { margin-top: 6px; font-size: 24px; font-weight: 700; letter-spacing: -0.015em; }
  .tagline {
    margin-top: 10px; font-size: 15px; color: var(--slate-600); line-height: 1.5;
    padding: 12px 14px; border-radius: var(--radius-md);
    background: var(--slate-50); border: 1px solid var(--slate-100);
  }
  form { margin-top: 28px; display: flex; flex-direction: column; gap: 18px; }
  label.field { display: flex; flex-direction: column; gap: 6px; }
  label.field span {
    font-size: 13px; font-weight: 600; color: var(--slate-700);
  }
  label.field .req { color: var(--amber-700); font-weight: 500; }
  input, textarea, select {
    font-family: inherit; font-size: 15px; color: var(--slate-900);
    padding: 10px 12px; border-radius: var(--radius-md);
    border: 1px solid var(--slate-200); background: var(--paper);
  }
  input:focus, textarea:focus, select:focus { outline: none; box-shadow: var(--focus); border-color: var(--slate-300); }
  textarea { min-height: 72px; resize: vertical; line-height: 1.5; }
  .hint { font-size: 12px; color: var(--slate-400); }
  .err {
    display: none; font-size: 13px; color: var(--amber-700);
    padding: 8px 10px; border-radius: var(--radius-sm);
    background: var(--amber-50); border: 1px solid var(--amber-100);
  }
  .err.show { display: block; }
  .actions { display: flex; flex-direction: column; gap: 10px; margin-top: 8px; }
  .back { text-align: center; font-size: 13px; color: var(--slate-500); }
  .back a { text-decoration: underline; text-underline-offset: 2px; }

  .goal-opt {
    border: 1px dashed var(--slate-200); border-radius: var(--radius-lg);
    padding: 12px 14px; background: var(--slate-50);
  }
  .goal-opt summary {
    cursor: pointer; font-size: 13px; font-weight: 650; color: var(--slate-700);
    list-style: none; display: flex; align-items: center; gap: 8px;
  }
  .goal-opt summary::-webkit-details-marker { display: none; }
  .goal-opt summary::before {
    content: "▸"; color: var(--slate-400); font-size: 11px;
  }
  .goal-opt[open] summary::before { content: "▾"; }
  .goal-opt .meta {
    font-size: 11px; font-weight: 500; color: var(--slate-400); margin-left: auto;
  }
  .goal-opt .inner { margin-top: 12px; display: flex; flex-direction: column; gap: 12px; }
  .goal-opt .note { font-size: 12px; color: var(--slate-500); line-height: 1.5; }
</style>
</head>
<body>
<nav class="proto-nav" aria-label="原型导航">
  <span class="brand">主路径原型</span>
  <a href="welcome.html">宣传站</a>
  <a href="login.html">登录</a>
  <a href="thin-home.html">薄入口</a>
  <a href="cases.html">案盘</a>
  <a href="dept-workbench.html">部门台</a>
  <a href="case-new.html" class="on">开案子</a>
  <a href="company-home.html">公司首页</a>
  <a href="pending-confirm.html">确认页</a>
  <span class="hint">极少字段 · 可选交办 · 进公司首页</span>
</nav>

<div class="screen-fill">
  <header class="app-top">
    <div class="crumbs">
      <a href="thin-home.html">薄入口</a>
      <span class="sep">/</span>
      <strong>开案子</strong>
    </div>
    <div class="top-right">
      <span class="chip">角色 · 企业</span>
      <a class="bell" href="pending-confirm.html" aria-label="待确认">🔔<span class="badge tabular">2</span></a>
    </div>
  </header>

  <div class="wrap">
    <div class="pos">立一条业务线</div>
    <h1>开案子</h1>
    <p class="tagline">外挂知识产权部 · 三步立一条业务线，然后进公司首页。不在此填交底长表。本页不交卷。</p>

    <form id="form" novalidate>
      <label class="field">
        <span>案名 <span class="req">必填</span></span>
        <input id="name" name="name" type="text" placeholder="例：边缘调度器" autocomplete="off" required />
      </label>
      <label class="field">
        <span>技术一句话 <span class="hint">（短）</span></span>
        <textarea id="blurb" name="blurb" placeholder="用一句话说明要保护什么"></textarea>
      </label>
      <label class="field">
        <span>联系人 <span class="hint">（短）</span></span>
        <input id="contact" name="contact" type="text" placeholder="姓名或邮箱" autocomplete="name" />
      </label>

      <details class="goal-opt" id="goal-opt">
        <summary>
          交办业务目标
          <span class="meta">可选 · 知产负责人</span>
        </summary>
        <div class="inner">
          <label class="field">
            <span>目标一句话 <span class="hint">（可选）</span></span>
            <input id="goal-text" name="goal" type="text" placeholder="例：先交底再查新，本季递交" autocomplete="off" />
          </label>
          <label class="field">
            <span>类型占位</span>
            <select id="goal-type" name="type" aria-label="类型由产品逻辑承接">
              <option value="">类型由产品逻辑承接</option>
              <option value="placeholder">（不编造四类清单 · 仅占位）</option>
            </select>
          </label>
          <p class="note">交办后仍进<strong>公司首页</strong>再「去当前部门」。交办后仍进公司首页，再去部门。</p>
        </div>
      </details>

      <div class="err" id="err">请先填写案名，才能创建并进入公司首页。</div>
      <div class="actions">
        <button type="submit" class="btn btn-primary btn-block" id="submit">创建并进入公司首页</button>
        <p class="back"><a href="thin-home.html">返回薄入口</a> · <a href="cases.html">案盘</a></p>
      </div>
    </form>
  </div>
</div>

<script>
const form = document.getElementById('form');
const nameEl = document.getElementById('name');
const err = document.getElementById('err');
if (location.hash === '#goal') {
  document.getElementById('goal-opt').open = true;
}
form.addEventListener('submit', e => {
  e.preventDefault();
  const v = (nameEl.value || '').trim();
  if (!v) {
    err.classList.add('show');
    nameEl.focus();
    return;
  }
  err.classList.remove('show');
  location.href = 'company-home.html';
});
nameEl.addEventListener('input', () => { if ((nameEl.value || '').trim()) err.classList.remove('show'); });
</script>
</body>
</html>
