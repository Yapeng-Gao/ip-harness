<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>小知 A · 3D 自研 v2</title>
    <style>
      :root {
        color-scheme: light;
        font-family: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; background: #e8ecf2; }
      #app { display: grid; grid-template-rows: auto 1fr; height: 100%; }
      header {
        display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center;
        padding: 12px 16px; background: #fff; border-bottom: 1px solid #e2e8f0;
      }
      h1 { margin: 0; font-size: 15px; color: #0f172a; }
      .muted { font-size: 12px; color: #64748b; }
      .chip {
        font-size: 10px; font-weight: 600; color: #475569;
        background: #f1f5f9; border-radius: 6px; padding: 2px 8px;
      }
      .chip-brand { background: #e8effc; color: #1e4bc4; }
      #stage { position: relative; min-height: 0; }
      canvas { display: block; width: 100% !important; height: 100% !important; }
      .hint {
        position: absolute; left: 12px; bottom: 12px;
        font-size: 11px; color: #475569; background: rgba(255,255,255,.88);
        padding: 4px 8px; border-radius: 6px; pointer-events: none;
      }
      .panel {
        position: absolute; right: 12px; top: 12px; width: 210px;
        background: rgba(255,255,255,.94); border: 1px solid #e2e8f0;
        border-radius: 12px; padding: 10px; font-size: 12px; color: #334155;
        max-height: calc(100% - 24px); overflow: auto;
      }
      .panel h2 { margin: 0 0 8px; font-size: 11px; color: #64748b; letter-spacing: .04em; }
      .row { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
      button {
        border: 1px solid #e2e8f0; background: #f8fafc; border-radius: 8px;
        padding: 6px 10px; font-size: 12px; cursor: pointer; color: #334155;
      }
      button[aria-pressed='true'] { background: #0f172a; color: #fff; border-color: #0f172a; }
      .swatch { display: flex; align-items: center; gap: 8px; margin: 4px 0; }
      .swatch i {
        width: 14px; height: 14px; border-radius: 4px; border: 1px solid rgba(0,0,0,.1);
      }
      code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; }
      .note { margin-top: 8px; font-size: 11px; line-height: 1.45; color: #64748b; }
    </style>
  </head>
  <body>
    <div id="app">
      <header>
        <h1>小知 A · 3D 自研 v2</h1>
        <span class="chip">独立页 · 不改 agent</span>
        <span class="chip chip-brand">品牌色 #2F5FE0</span>
        <span class="muted">程序化半身升级 · 非外包 GLB</span>
      </header>
      <div id="stage">
        <div class="hint">拖拽旋转 · 滚轮缩放</div>
        <aside class="panel">
          <h2>PRESENCE</h2>
          <div class="row" id="presence-btns">
            <button type="button" data-p="idle" aria-pressed="true">待机</button>
            <button type="button" data-p="thinking">分诊</button>
            <button type="button" data-p="waiting">引导</button>
          </div>
          <h2>色板 v1 定稿</h2>
          <div class="swatch"><i style="background:#E8C4A8"></i>肤 <code>#E8C4A8</code></div>
          <div class="swatch"><i style="background:#4A2F26"></i>发 <code>#4A2F26</code></div>
          <div class="swatch"><i style="background:#B8BEC6"></i>西装 <code>#B8BEC6</code></div>
          <div class="swatch"><i style="background:#F4F5F7"></i>衬衫 <code>#F4F5F7</code></div>
          <div class="swatch"><i style="background:#2F5FE0"></i>品牌 <code>#2F5FE0</code></div>
          <p class="note">品牌色只给丝巾 / 挂绳 / 工牌。详 <code>COLORS.md</code>。</p>
        </aside>
      </div>
    </div>

    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
        }
      }
    </script>
    <script type="module">
      import * as THREE from 'three'
      import { OrbitControls } from 'three/addons/controls/OrbitControls.js'
      import { createXiaoZhiA, updateXiaoZhiA, XZ } from './xiaozhi-character.js'

      const stage = document.getElementById('stage')
      const renderer = new THREE.WebGLRenderer({ antialias: true })
      renderer.setPixelRatio(Math.min(devicePixelRatio, 2))
      renderer.setClearColor(XZ.bg)
      renderer.outputColorSpace = THREE.SRGBColorSpace
      stage.appendChild(renderer.domElement)

      const scene = new THREE.Scene()
      const camera = new THREE.PerspectiveCamera(30, 1, 0.1, 40)
      camera.position.set(0.4, 0.12, 2.15)

      const controls = new OrbitControls(camera, renderer.domElement)
      controls.enablePan = false
      controls.minDistance = 1.25
      controls.maxDistance = 3.8
      controls.minPolarAngle = Math.PI / 3.3
      controls.maxPolarAngle = Math.PI / 1.7
      controls.target.set(0, 0.08, 0)

      scene.add(new THREE.HemisphereLight(0xf5f7fa, 0xb0b8c4, 0.55))
      scene.add(new THREE.AmbientLight(0xffffff, 0.35))
      const key = new THREE.DirectionalLight(0xffffff, 1.35)
      key.position.set(2.2, 3.0, 2.4)
      scene.add(key)
      const fill = new THREE.DirectionalLight(0xdde4f0, 0.45)
      fill.position.set(-2.0, 1.2, -0.8)
      scene.add(fill)
      const rim = new THREE.DirectionalLight(0xe8eef8, 0.55)
      rim.position.set(0.1, 1.5, 2.5)
      scene.add(rim)

      // 地面影
      const shadowMat = new THREE.MeshBasicMaterial({
        color: 0x94a3b8,
        transparent: true,
        opacity: 0.22,
      })
      const shadow = new THREE.Mesh(new THREE.CircleGeometry(0.55, 32), shadowMat)
      shadow.rotation.x = -Math.PI / 2
      shadow.position.y = -0.72
      scene.add(shadow)

      const fig = createXiaoZhiA()
      scene.add(fig.root)

      let presence = 'idle'
      document.querySelectorAll('#presence-btns button').forEach((btn) => {
        btn.addEventListener('click', () => {
          presence = btn.dataset.p
          document.querySelectorAll('#presence-btns button').forEach((b) => {
            b.setAttribute('aria-pressed', String(b === btn))
          })
        })
      })

      function resize() {
        const w = stage.clientWidth
        const h = stage.clientHeight
        camera.aspect = w / Math.max(h, 1)
        camera.updateProjectionMatrix()
        renderer.setSize(w, h, false)
      }
      resize()
      new ResizeObserver(resize).observe(stage)

      const clock = new THREE.Clock()
      function tick() {
        const t = clock.getElapsedTime()
        updateXiaoZhiA(fig, presence, t)
        shadow.scale.setScalar(1 + Math.sin(t * 1.45) * 0.02)
        controls.update()
        renderer.render(scene, camera)
        requestAnimationFrame(tick)
      }
      tick()
    </script>
  </body>
</html>
